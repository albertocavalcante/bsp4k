org.gradle.jvmargs=-Xmx2g -XX:+UseParallelGC
org.gradle.parallel=true
org.gradle.caching=true
org.gradle.configuration-cache=true

kotlin.code.style=official
kotlin.native.ignoreDisabledTargets=true
kotlin.mpp.applyDefaultHierarchyTemplate=false

# jsonrpc4k revision (full 40-character commit SHA) that the sibling checkout ../jsonrpc4k (or the
# directory given by -Pbsp4k.jsonrpc4kBuild) must be at. CI reads it from here to check out jsonrpc4k,
# and settings.gradle.kts compares the checkout's git HEAD with it: a mismatch fails under CI=true and
# warns locally. Opt out locally with -Pbsp4k.allowJsonrpc4kPinMismatch=true. Bump it here and nowhere else.
bsp4k.jsonrpc4kPin=f915ecff05e8f65f987feca5151ba7764913e6a8

