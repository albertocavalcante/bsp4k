name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event_name == 'pull_request' && github.head_ref || github.sha }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  JAVA_VERSION: '21'
  JAVA_DISTRIBUTION: 'temurin'
  JSONRPC4K_REV: 'a79b71c24e3d77317fdf2e842b5bd85aef1d8efa'

defaults:
  run:
    working-directory: bsp4k

jobs:
  # ===========================================================================
  # Job 1: Build & Test
  # ===========================================================================
  test:
    name: Test
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: read

    steps:
      - name: Checkout
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          path: bsp4k
          fetch-depth: 1
          persist-credentials: false

      - name: Checkout jsonrpc4k
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          repository: albertocavalcante/jsonrpc4k
          ref: ${{ env.JSONRPC4K_REV }}
          path: jsonrpc4k
          fetch-depth: 1
          persist-credentials: false

      - name: Set up JDK
        uses: actions/setup-java@be666c2fcd27ec809703dec50e508c2fdc7f6654 # v5.2.0
        with:
          java-version: ${{ env.JAVA_VERSION }}
          distribution: ${{ env.JAVA_DISTRIBUTION }}

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@f29f5a9d7b09a7c6b29859002d29d24e1674c884 # v5.0.1
        with:
          cache-read-only: ${{ github.ref != 'refs/heads/main' }}

      - name: Build
        run: ./gradlew build -x test -x detekt

      - name: Test
        run: ./gradlew test

      - name: Upload Test Results
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6.0.0
        if: always()
        with:
          name: test-results
          path: 'bsp4k/**/build/reports/tests/'
          retention-days: 7

  # ===========================================================================
  # Job 2: Lint (Detekt)
  # ===========================================================================
  lint:
    name: Lint
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: read

    steps:
      - name: Checkout
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          path: bsp4k
          fetch-depth: 1
          persist-credentials: false

      - name: Checkout jsonrpc4k
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          repository: albertocavalcante/jsonrpc4k
          ref: ${{ env.JSONRPC4K_REV }}
          path: jsonrpc4k
          fetch-depth: 1
          persist-credentials: false

      - name: Set up JDK
        uses: actions/setup-java@be666c2fcd27ec809703dec50e508c2fdc7f6654 # v5.2.0
        with:
          java-version: ${{ env.JAVA_VERSION }}
          distribution: ${{ env.JAVA_DISTRIBUTION }}

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@f29f5a9d7b09a7c6b29859002d29d24e1674c884 # v5.0.1
        with:
          cache-read-only: true

      - name: Detekt
        run: ./gradlew detekt

  # ===========================================================================
  # Job 3: Format Check (Spotless)
  # ===========================================================================
  format:
    name: Format Check
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: read

    steps:
      - name: Checkout
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          path: bsp4k
          fetch-depth: 1
          persist-credentials: false

      - name: Checkout jsonrpc4k
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          repository: albertocavalcante/jsonrpc4k
          ref: ${{ env.JSONRPC4K_REV }}
          path: jsonrpc4k
          fetch-depth: 1
          persist-credentials: false

      - name: Set up JDK
        uses: actions/setup-java@be666c2fcd27ec809703dec50e508c2fdc7f6654 # v5.2.0
        with:
          java-version: ${{ env.JAVA_VERSION }}
          distribution: ${{ env.JAVA_DISTRIBUTION }}

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@f29f5a9d7b09a7c6b29859002d29d24e1674c884 # v5.0.1
        with:
          cache-read-only: true

      - name: Spotless Check
        run: ./gradlew spotlessCheck

  # ===========================================================================
  # Job 5: macOS Apple targets
  # ===========================================================================
  macos:
    name: macOS Native Check
    runs-on: macos-15
    timeout-minutes: 30
    permissions:
      contents: read

    steps:
      - name: Checkout
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          path: bsp4k
          fetch-depth: 1
          persist-credentials: false

      - name: Checkout jsonrpc4k
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          repository: albertocavalcante/jsonrpc4k
          ref: ${{ env.JSONRPC4K_REV }}
          path: jsonrpc4k
          fetch-depth: 1
          persist-credentials: false

      - name: Set up JDK
        uses: actions/setup-java@be666c2fcd27ec809703dec50e508c2fdc7f6654 # v5.2.0
        with:
          java-version: ${{ env.JAVA_VERSION }}
          distribution: ${{ env.JAVA_DISTRIBUTION }}

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@f29f5a9d7b09a7c6b29859002d29d24e1674c884 # v5.0.1
        with:
          cache-read-only: ${{ github.ref != 'refs/heads/main' }}

      - name: Show Xcode
        run: xcrun xcodebuild -version

      - name: Check Apple targets
        run: ./gradlew compileTestKotlinMacosX64 macosArm64Test

  # ===========================================================================
  # Job 6: Coverage (Kover)
  # ===========================================================================
  coverage:
    name: Coverage
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    permissions:
      contents: read

    steps:
      - name: Checkout
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          path: bsp4k
          fetch-depth: 1
          persist-credentials: false

      - name: Checkout jsonrpc4k
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          repository: albertocavalcante/jsonrpc4k
          ref: ${{ env.JSONRPC4K_REV }}
          path: jsonrpc4k
          fetch-depth: 1
          persist-credentials: false

      - name: Set up JDK
        uses: actions/setup-java@be666c2fcd27ec809703dec50e508c2fdc7f6654 # v5.2.0
        with:
          java-version: ${{ env.JAVA_VERSION }}
          distribution: ${{ env.JAVA_DISTRIBUTION }}

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@f29f5a9d7b09a7c6b29859002d29d24e1674c884 # v5.0.1
        with:
          cache-read-only: ${{ github.ref != 'refs/heads/main' }}

      - name: Kover Coverage Report
        run: ./gradlew koverHtmlReport koverXmlReport

      - name: Kover Coverage Verify
        run: ./gradlew koverVerify

      - name: Upload Coverage Report
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6.0.0
        if: always()
        with:
          name: coverage-report
          path: bsp4k/build/reports/kover/
          retention-days: 7

  java17-consumer:
    name: Published Java 17 BSP consumer
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    permissions:
      contents: read
    steps:
      - name: Checkout BSP4K
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          path: bsp4k
          fetch-depth: 1
          persist-credentials: false
      - name: Checkout JSON-RPC foundation
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          repository: albertocavalcante/jsonrpc4k
          ref: ${{ env.JSONRPC4K_REV }}
          path: jsonrpc4k
          fetch-depth: 1
          persist-credentials: false
      - name: Set up Java 17 runtime
        uses: actions/setup-java@be666c2fcd27ec809703dec50e508c2fdc7f6654 # v5.2.0
        with:
          java-version: '17'
          distribution: temurin
      - name: Set up Java 21 for Gradle
        uses: actions/setup-java@be666c2fcd27ec809703dec50e508c2fdc7f6654 # v5.2.0
        with:
          java-version: '21'
          distribution: temurin
      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@f29f5a9d7b09a7c6b29859002d29d24e1674c884 # v5.0.1
        with:
          cache-read-only: true
      - name: Verify isolated published artifacts
        run: tools/ci/java17-consumer.sh
