name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event_name == 'pull_request' && github.head_ref || github.sha }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  JAVA_VERSION: '21'
  JAVA_DISTRIBUTION: 'temurin'

defaults:
  run:
    working-directory: bsp4k

jobs:
  # ===========================================================================
  # Job 1: Build & Test
  # ===========================================================================
  test:
    name: Test
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: read

    steps:
      - name: Checkout
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          path: bsp4k
          fetch-depth: 1
          persist-credentials: false

      - name: Checkout jsonrpc4k at the pinned revision
        uses: ./bsp4k/.github/actions/checkout-jsonrpc4k

      - name: Set up JDK
        uses: actions/setup-java@be666c2fcd27ec809703dec50e508c2fdc7f6654 # v5.2.0
        with:
          java-version: ${{ env.JAVA_VERSION }}
          distribution: ${{ env.JAVA_DISTRIBUTION }}

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@f29f5a9d7b09a7c6b29859002d29d24e1674c884 # v5.0.1
        with:
          cache-read-only: ${{ github.ref != 'refs/heads/main' }}

      - name: Build
        run: ./gradlew build -x test -x detekt

      - name: Test
        run: ./gradlew test

      - name: Upload Test Results
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6.0.0
        if: always()
        with:
          name: test-results
          path: 'bsp4k/**/build/reports/tests/'
          retention-days: 7

  # ===========================================================================
  # Job 2: Lint (Detekt)
  # ===========================================================================
  lint:
    name: Lint
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: read

    steps:
      - name: Checkout
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          path: bsp4k
          fetch-depth: 1
          persist-credentials: false

      - name: Checkout jsonrpc4k at the pinned revision
        uses: ./bsp4k/.github/actions/checkout-jsonrpc4k

      - name: Set up JDK
        uses: actions/setup-java@be666c2fcd27ec809703dec50e508c2fdc7f6654 # v5.2.0
        with:
          java-version: ${{ env.JAVA_VERSION }}
          distribution: ${{ env.JAVA_DISTRIBUTION }}

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@f29f5a9d7b09a7c6b29859002d29d24e1674c884 # v5.0.1
        with:
          cache-read-only: true

      - name: Detekt
        run: ./gradlew detekt

  # ===========================================================================
  # Job 3: Format Check (Spotless)
  # ===========================================================================
  format:
    name: Format Check
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: read

    steps:
      - name: Checkout
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          path: bsp4k
          fetch-depth: 1
          persist-credentials: false

      - name: Checkout jsonrpc4k at the pinned revision
        uses: ./bsp4k/.github/actions/checkout-jsonrpc4k

      - name: Set up JDK
        uses: actions/setup-java@be666c2fcd27ec809703dec50e508c2fdc7f6654 # v5.2.0
        with:
          java-version: ${{ env.JAVA_VERSION }}
          distribution: ${{ env.JAVA_DISTRIBUTION }}

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@f29f5a9d7b09a7c6b29859002d29d24e1674c884 # v5.0.1
        with:
          cache-read-only: true

      - name: Spotless Check
        run: ./gradlew spotlessCheck

  # ===========================================================================
  # Job 5: macOS Apple targets
  # ===========================================================================
  macos:
    name: macOS Native Check
    runs-on: macos-15
    timeout-minutes: 30
    permissions:
      contents: read

    steps:
      - name: Checkout
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          path: bsp4k
          fetch-depth: 1
          persist-credentials: false

      - name: Checkout jsonrpc4k at the pinned revision
        uses: ./bsp4k/.github/actions/checkout-jsonrpc4k

      - name: Set up JDK
        uses: actions/setup-java@be666c2fcd27ec809703dec50e508c2fdc7f6654 # v5.2.0
        with:
          java-version: ${{ env.JAVA_VERSION }}
          distribution: ${{ env.JAVA_DISTRIBUTION }}

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@f29f5a9d7b09a7c6b29859002d29d24e1674c884 # v5.0.1
        with:
          cache-read-only: ${{ github.ref != 'refs/heads/main' }}

      - name: Show Xcode
        run: xcrun xcodebuild -version

      - name: Check Apple targets
        run: ./gradlew compileTestKotlinMacosX64 macosArm64Test

  # ===========================================================================
  # Job 6: Coverage (Kover)
  # ===========================================================================
  coverage:
    name: Coverage
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    permissions:
      contents: read

    steps:
      - name: Checkout
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          path: bsp4k
          fetch-depth: 1
          persist-credentials: false

      - name: Checkout jsonrpc4k at the pinned revision
        uses: ./bsp4k/.github/actions/checkout-jsonrpc4k

      - name: Set up JDK
        uses: actions/setup-java@be666c2fcd27ec809703dec50e508c2fdc7f6654 # v5.2.0
        with:
          java-version: ${{ env.JAVA_VERSION }}
          distribution: ${{ env.JAVA_DISTRIBUTION }}

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@f29f5a9d7b09a7c6b29859002d29d24e1674c884 # v5.0.1
        with:
          cache-read-only: ${{ github.ref != 'refs/heads/main' }}

      - name: Kover Coverage Report
        run: ./gradlew koverHtmlReport koverXmlReport

      - name: Kover Coverage Verify
        run: ./gradlew koverVerify

      - name: Upload Coverage Report
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6.0.0
        if: always()
        with:
          name: coverage-report
          path: bsp4k/build/reports/kover/
          retention-days: 7

  java17-consumer:
    name: Published Java 17 BSP consumer
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    permissions:
      contents: read
    steps:
      - name: Checkout BSP4K
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          path: bsp4k
          fetch-depth: 1
          persist-credentials: false
      - name: Checkout jsonrpc4k at the pinned revision
        uses: ./bsp4k/.github/actions/checkout-jsonrpc4k
      - name: Set up Java 17 runtime
        uses: actions/setup-java@be666c2fcd27ec809703dec50e508c2fdc7f6654 # v5.2.0
        with:
          java-version: '17'
          distribution: temurin
      - name: Set up Java 21 for Gradle
        uses: actions/setup-java@be666c2fcd27ec809703dec50e508c2fdc7f6654 # v5.2.0
        with:
          java-version: '21'
          distribution: temurin
      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@f29f5a9d7b09a7c6b29859002d29d24e1674c884 # v5.0.1
        with:
          cache-read-only: true
      - name: Verify isolated published artifacts
        run: tools/ci/java17-consumer.sh

  # ===========================================================================
  # Job 8: Windows x64 native tests (mingwX64)
  # ===========================================================================
  windows:
    name: Windows Native Tests
    runs-on: windows-latest
    timeout-minutes: 30
    permissions:
      contents: read

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          path: bsp4k
          fetch-depth: 1
          persist-credentials: false

      - name: Checkout jsonrpc4k at the pinned revision
        uses: ./bsp4k/.github/actions/checkout-jsonrpc4k

      - name: Set up JDK
        uses: actions/setup-java@77dd5b2ce225ea11469928ac317850245a74ae78 # v6.2.0
        with:
          java-version: ${{ env.JAVA_VERSION }}
          distribution: ${{ env.JAVA_DISTRIBUTION }}

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@0723195856401067f7a2779048b490ace7a47d7c # v5.0.2
        with:
          cache-read-only: ${{ github.ref != 'refs/heads/main' }}

      - name: Run mingwX64 tests
        run: ./gradlew mingwX64Test

      - name: Upload mingwX64 test executables
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: mingw-x64-test-executables
          path: 'bsp4k/*/build/bin/mingwX64/debugTest/test.exe'
          if-no-files-found: error
          retention-days: 1

  # ===========================================================================
  # Job 9: Linux ARM64 native build (cross-compiled; Kotlin/Native has no linux-aarch64 host)
  # ===========================================================================
  linux-arm64-build:
    name: Linux ARM64 Build
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    permissions:
      contents: read

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          path: bsp4k
          fetch-depth: 1
          persist-credentials: false

      - name: Checkout jsonrpc4k at the pinned revision
        uses: ./bsp4k/.github/actions/checkout-jsonrpc4k

      - name: Set up JDK
        uses: actions/setup-java@77dd5b2ce225ea11469928ac317850245a74ae78 # v6.2.0
        with:
          java-version: ${{ env.JAVA_VERSION }}
          distribution: ${{ env.JAVA_DISTRIBUTION }}

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@0723195856401067f7a2779048b490ace7a47d7c # v5.0.2
        with:
          cache-read-only: ${{ github.ref != 'refs/heads/main' }}

      - name: Link linuxArm64 test executables
        run: ./gradlew linkDebugTestLinuxArm64

      - name: Upload linuxArm64 test executables
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: linux-arm64-test-executables
          path: 'bsp4k/*/build/bin/linuxArm64/debugTest/test.kexe'
          if-no-files-found: error
          retention-days: 1

  # ===========================================================================
  # Job 10: Linux ARM64 tests on a native ARM64 runner
  # ===========================================================================
  linux-arm64:
    name: Linux ARM64 Tests
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 30
    needs: linux-arm64-build
    permissions:
      contents: read

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          path: bsp4k
          fetch-depth: 1
          persist-credentials: false

      - name: Checkout jsonrpc4k at the pinned revision
        uses: ./bsp4k/.github/actions/checkout-jsonrpc4k

      - name: Set up JDK 17 (aarch64)
        uses: actions/setup-java@77dd5b2ce225ea11469928ac317850245a74ae78 # v6.2.0
        with:
          java-version: '17'
          distribution: temurin

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@0723195856401067f7a2779048b490ace7a47d7c # v5.0.2
        with:
          cache-read-only: ${{ github.ref != 'refs/heads/main' }}

      - name: Verify ARM64 host
        run: |
          uname -m
          java -XshowSettings:properties -version 2>&1 | grep -E 'os.arch|java.version '

      - name: JVM and Node.js tests
        run: ./gradlew jvmTest jsNodeTest

      - name: Download linuxArm64 test executables
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: linux-arm64-test-executables
          path: bsp4k

      - name: Run linuxArm64 native tests
        shell: bash
        run: |
          set -euo pipefail
          found=0
          for exe in */build/bin/linuxArm64/debugTest/test.kexe; do
            found=$((found + 1))
            module="${exe%%/*}"
            chmod +x "$exe"
            file "$exe"
            echo "::group::$module test.kexe"
            (cd "$module" && ./build/bin/linuxArm64/debugTest/test.kexe)
            echo "::endgroup::"
          done
          test "$found" -ge 3

  # ===========================================================================
  # Job 11: Windows ARM64 tests (native JVM and Node.js; mingwX64 under x64 emulation)
  # ===========================================================================
  windows-arm64:
    name: Windows ARM64 Tests
    runs-on: windows-11-arm
    timeout-minutes: 40
    needs: windows
    permissions:
      contents: read

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          path: bsp4k
          fetch-depth: 1
          persist-credentials: false

      - name: Checkout jsonrpc4k at the pinned revision
        uses: ./bsp4k/.github/actions/checkout-jsonrpc4k

      - name: Set up JDK 17 (aarch64)
        uses: actions/setup-java@77dd5b2ce225ea11469928ac317850245a74ae78 # v6.2.0
        with:
          java-version: '17'
          distribution: microsoft

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@0723195856401067f7a2779048b490ace7a47d7c # v5.0.2
        with:
          cache-read-only: ${{ github.ref != 'refs/heads/main' }}

      - name: Verify ARM64 host
        shell: bash
        run: |
          echo "PROCESSOR_ARCHITECTURE=$PROCESSOR_ARCHITECTURE"
          java -XshowSettings:properties -version 2>&1 | grep -E 'os.arch|java.version '

      - name: JVM and Node.js tests
        run: ./gradlew jvmTest jsNodeTest --continue

      - name: Show failed tests
        if: failure()
        shell: bash
        run: grep -h -A12 '<failure' */build/test-results/*/*.xml | head -150 || true

      - name: Download mingwX64 test executables
        if: ${{ !cancelled() }}
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: mingw-x64-test-executables
          path: bsp4k

      - name: Run mingwX64 native tests (x64 emulation)
        if: ${{ !cancelled() }}
        shell: bash
        run: |
          set -euo pipefail
          found=0
          for exe in */build/bin/mingwX64/debugTest/test.exe; do
            found=$((found + 1))
            module="${exe%%/*}"
            echo "::group::$module test.exe"
            (cd "$module" && ./build/bin/mingwX64/debugTest/test.exe)
            echo "::endgroup::"
          done
          test "$found" -ge 3
